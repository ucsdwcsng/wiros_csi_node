# Phone-facing listener on Pi 1's isolated router Ethernet network.
listener 1883 192.168.48.20
allow_anonymous true

# Relay phone application data to the central NUC over the backhaul LAN.
connection wires-central-backhaul
address 192.168.50.1:1883
bridge_protocol_version mqttv311
remote_clientid rpi-1-relay
try_private false
notifications false
restart_timeout 5

topic /csi out 1
topic /csi-trigger out 1
topic /ml-training out 1
topic /gps/raw out 1

# Return application responses to the phone.
topic /gps/corrected in 1
topic csi/ack/# in 1
topic csi/status/# in 1
topic csi/counts in 1
